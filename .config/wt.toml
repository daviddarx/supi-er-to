# Worktrunk project config — https://worktrunk.dev
#
# Each worktree gets its own Next.js dev server on a port derived from the
# branch name (stable across machines and restarts).

# Array-of-tables = sequential stages. Table form would run them concurrently,
# which would start the server before deps exist.

[[post-start]]
copy = "wt step copy-ignored"

[[post-start]]
deps = "npm install"

[[post-start]]
# `tether` ties the server's lifetime to the worktree: removing the worktree
# kills the whole process tree, so no orphaned `next dev` processes pile up.
server = "wt step tether -- npm run dev -- --port {{ branch | hash_port }}"

[list]
url = "http://localhost:{{ branch | hash_port }}"

[aliases]
open = "open http://localhost:{{ branch | hash_port }}"
# Tails the most recently written dev-server log. Picking the newest by
# mtime rather than matching the branch name avoids the feat-test-1 /
# feat-test-10 prefix collision.
logs = '''tail -f "$(wt config state logs --format=json | jq -r '[.hook_output[] | select(.source == "project" and .hook_type == "post-start" and .name == "server")] | sort_by(.modified_at) | last | .path')"'''

# pkill exits 1 when nothing matched; `|| true` keeps `wt stop` from
# reporting failure when the server is already down.
stop = "pkill -f 'next dev --port {{ branch | hash_port }}' || true"